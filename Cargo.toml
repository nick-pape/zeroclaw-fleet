[package]
name = "zeroclaw-fleet"
version = "0.1.0"
edition = "2024"
description = "Orchestrator for running multiple isolated ZeroClaw instances under one host"
license = "MIT OR Apache-2.0"
readme = "README.md"

[[bin]]
name = "zeroclaw-fleet"
path = "src/main.rs"

[dependencies]
# HTTP framework
axum = { version = "0.8", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }

# HTTP client (claw polling, Authentik, LiteLLM)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Docker API
bollard = "0.18"

# Embedded static assets (web/)
rust-embed = { version = "8", features = ["debug-embed"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Misc
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
mime_guess = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
axum-test = "17"
tempfile = "3"
